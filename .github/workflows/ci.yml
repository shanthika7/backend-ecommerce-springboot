name: CI Pipeline

on:
  push:
    branches: 
      - github-actions-pipeline
jobs:
  test: 
    runs-on: ubuntu-latest

    services:
      mysql: 
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: full-stack-ecommerce
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      REMOTE_DATABASE_URL: jdbc:mysql://localhost:3306/full-stack-ecommerce
      REMOTE_DATABASE_USER: root
      REMOTE_DATABASE_PASSWORD: root
    steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: Setup JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin' 
      - name: wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready..."
          until mysqladmin ping -h "localhost" --silent; do
            sleep 5
          done
      - name: Build & Test
        run: ./mvnw clean install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-jar
          path: target/*.jar
      
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download artifact from test
        uses: actions/download-artifact@v4
        with:
          name: ecommerce-jar
          path: target/

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build
        run: ./mvnw clean install

