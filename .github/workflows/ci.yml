name: CI Pipeline

on:
  push:
    branches:
      - github-actions-pipeline

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build application
        run: ./mvnw clean install -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4 
        with: 
          name: backend-jar                  # give a name to artifact
          path: target/*.jar                 # upload the JAR file
    
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target/

      - name: Run tests
        run: ./mvnw test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #- name: List files in target folder
      #  run: ls -la target/ 
      
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target/

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest