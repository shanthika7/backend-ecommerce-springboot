name: CI Pipeline

on:
  push:
    branches:
      - github-actions-pipeline

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build application (skip tests)
        run: ./mvnw clean install -DskipTests
